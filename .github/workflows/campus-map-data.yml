# Refreshes the campus map drawing (public/map/campus.json) from OpenStreetMap.
# Run it from the Actions tab ("Refresh campus map data" > Run workflow) after
# changing the area in scripts/build-campus-map.mjs. It commits the new file to
# the branch it ran on.
name: Refresh campus map data

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-rtxono]
    paths: [.github/workflows/campus-map-data.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download from OpenStreetMap (Overpass API)
        run: |
          # The query is the one documented at the top of scripts/build-campus-map.mjs.
          sed -n '/\[out:json\]/,/out geom;/p' scripts/build-campus-map.mjs | sed 's/^ \*   //' > query.overpassql
          cat query.overpassql
          for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            if curl -fsS --retry 3 --retry-delay 10 -m 300 -A "inspire-campus-map-build" --data-urlencode "data@query.overpassql" "$url" -o export.osm.json; then break; fi
          done
          test -s export.osm.json
          npx --yes osmtogeojson@3.0.0-beta.5 export.osm.json > export.geojson
      - name: Build the drawing
        run: node scripts/build-campus-map.mjs export.geojson
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/map/campus.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh campus map data from OpenStreetMap"
          git push
